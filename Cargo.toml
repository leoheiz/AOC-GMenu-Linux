[workspace]
resolver = "2"
members = [
    ".",
    "aoc-gmenu-gui",
    "aoc-crosshair",
    "aoc-gmenu-tray",
]
default-members = [".", "aoc-gmenu-gui", "aoc-crosshair", "aoc-gmenu-tray"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
authors = ["leoheiz"]
repository = "https://github.com/leoheiz/AOC-GMenu-Linux"
homepage = "https://github.com/leoheiz/AOC-GMenu-Linux"

[workspace.lints.cargo]
redundant_homepage = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
aoc-gmenu = { path = "." }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
i2cdev = "0.6"
tiny-skia = "0.11"
dirs = "5"

[package]
name = "aoc-gmenu"
version.workspace = true
edition.workspace = true
description = "Unofficial Linux DDC/CI CLI and library for AOC monitors (G-Menu port)"
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "aoc_gmenu"
path = "src/lib.rs"

[[bin]]
name = "aoc-gmenu"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
i2cdev = { workspace = true }
dirs = { workspace = true }

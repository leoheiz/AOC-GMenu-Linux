[package]
name = "aoc-gmenu-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Unofficial AOC G-Menu GUI (eframe/egui) for Linux"

[lints]
workspace = true

[[bin]]
name = "aoc-gmenu-gui"
path = "src/main.rs"

[dependencies]
aoc-gmenu = { workspace = true }
aoc-crosshair = { path = "../aoc-crosshair" }
eframe = { version = "0.29", default-features = true, features = ["wayland", "x11", "glow"] }
egui = "0.29"
serde = { workspace = true }
toml = { workspace = true }
tiny-skia = { workspace = true }
